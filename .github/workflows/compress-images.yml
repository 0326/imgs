name: Compress Images

on:
  push:
    paths:
      - 'blog/**'
  pull_request:
    paths:
      - 'blog/**'

permissions:
  contents: write

jobs:
  compress-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y pngquant jpegoptim optipng

      - name: Compress images
        run: python compress_images.py

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global pull.rebase false

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet --exit-code q50/ thumb/; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.no_changes == 'false'
        run: |
          git add q50/ thumb/
          git commit -m 'Compress images automatically'
          git push origin HEAD:${GITHUB_REF_NAME} --force-with-lease